name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci --ignore-scripts && npx --no-install playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: bash run.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test/e2e/test-results/
          retention-days: 7

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix package build
        run: ./scripts/check-nix-build.sh

  release:
    needs: [test, e2e, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build-all VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} DATE=$(date -u +%Y-%m-%d)

      - name: Generate checksums
        working-directory: dist
        run: sha256sum crit-plus-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/crit-plus-*
            dist/checksums.txt
            LICENSE
            NOTICE

      - name: Update Homebrew formula
        if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"

          SHA_DARWIN_ARM64=$(sha256sum dist/crit-plus-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_AMD64=$(sha256sum dist/crit-plus-darwin-amd64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum dist/crit-plus-linux-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum dist/crit-plus-linux-arm64 | cut -d' ' -f1)

          BASE_URL="https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" homebrew-tap
          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/crit-plus.rb <<FORMULA
          class CritPlus < Formula
            desc "Enhanced fork of Crit by Tomasz Tomczyk with review and decisions"
            homepage "https://github.com/${RELEASE_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/crit-plus-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/crit-plus-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/crit-plus-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/crit-plus-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir["crit-plus-*"].first || "crit-plus"
              bin.install binary => "crit-plus"
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/crit-plus --version").strip
            end
          end
          FORMULA

          cd homebrew-tap
          git add Formula/crit-plus.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update crit-plus to ${TAG}"
          git push origin main
