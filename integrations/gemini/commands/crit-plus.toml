description = "Collect decisions or review code changes and plans with Crit Plus"
prompt = """
# Review with Crit Plus

Crit Plus (`crit-plus`) is an enhanced fork of [Crit](https://github.com/tomasz-tomczyk/crit), originally created by **Tomasz Tomczyk**. The upstream MIT license and copyright are preserved.

Review and revise code changes or a plan using `crit-plus` for inline comment review.

## Choose the workflow

If the user wants to select proposals, adjudicate questions, or supplies
`decide` arguments, load the installed `crit-plus-decide` skill. It prepares the
checklist, runs `crit-plus decide`, and handles partial submissions and revisions.
Use that workflow through completion; the remaining steps here apply to inline
review, whose approval rules differ from decision results.

## Step 1: Determine review mode

Pick whichever applies — don't ask for confirmation:

1. **User argument** — `{{args}}` provided (e.g., `/crit-plus my-plan.md`) → review that file
2. **Recent plan** — no argument, but a plan was written earlier in this conversation → `crit-plus <plan-file>`
3. **Branch review** — otherwise → bare `crit-plus`. Auto-detects uncommitted changes or branch-vs-default-branch diff. Works on clean branches.

<important if="the user asked to review a specific GitHub PR or a commit range">
Use `crit-plus --pr <num|url>` or `crit-plus --range <baseSHA>..<headSHA>`. This boots crit-plus in *range mode*, scoping the review to a fixed range of commits rather than the working tree.
</important>

## Step 2: Launch crit-plus and block until review completes

**CRITICAL — you MUST run this step. Do NOT skip it. Do NOT proceed without it.**

Tell the user upfront: **"Opening crit-plus for review — leave inline comments in the browser and click Finish Review when done."**

Then run `crit-plus` via `run_shell_command` — it blocks until the user clicks "Finish Review", then the tool call completes:

```bash
crit-plus <plan-file>   # specific file
crit-plus               # git mode
```

If a crit-plus server is already running from earlier in this conversation, `crit-plus` automatically connects to it. Starting from scratch, it spawns the daemon, opens the browser, and blocks until the user clicks "Finish Review".

**Do NOT proceed until `run_shell_command` returns.** Do NOT ask the user to type anything. Do NOT read the review file early. The tool call completing is how you know the human is done reviewing.

## Step 3: Read the review output

When `crit-plus` completes, read **stdout** and follow its instructions. Check **stderr** for `approved: true` or `approved: false`.

<important if="a comment has a quote, anchor, or drifted field">
- `quote`: the specific text the reviewer selected — focus your changes on the quoted text rather than the entire line range
- `anchor`: use it to locate the current position of the content; line numbers may be stale after edits
- `drifted: true`: original content was removed or heavily rewritten — line numbers are approximate at best
</important>

## Step 4: Address each review comment

For each unresolved comment:

1. Understand what the comment asks for
2. If it contains a suggestion block, apply that specific change
3. Revise the referenced file (plan or code file from the diff) using `replace`
4. Reply with what you did: `crit-plus comment --reply-to <id> --author 'Gemini' '<what you did>'` (reply bodies support markdown)
5. **Do not pass `--resolve`.** Resolving is the reviewer's call. Only add `--resolve` if the user explicitly asks.

Editing the plan file triggers Crit Plus's live reload — the user sees changes in the browser immediately.

<important if="you are replying to multiple comments at once">
Use `--json` for a single bulk call instead of one invocation per comment:

```bash
echo '[
  {"reply_to": "c_a1b2c3", "body": "Fixed"},
  {"reply_to": "c_d4e5f6", "body": "Refactored as suggested"}
]' | crit-plus comment --json --author 'Gemini'
```
</important>

**If there are zero review comments**: inform the user no changes were requested.

## Step 5: Signal completion and start next round

**CRITICAL — you MUST run this step. Do NOT skip it. Do NOT proceed without it.**

The finish prompt on stdout includes the command to run again — use it to start a new round.

On subsequent calls, `crit-plus` automatically signals round-complete first, then blocks until the next "Finish Review" click.

Tell the user: **"Changes applied. Review the diff in your browser and click Finish Review when ready."**

**Do NOT proceed until `run_shell_command` returns.** When it does, return to Step 3. If the user finishes with zero comments, the review is approved — stop the loop and proceed.

<important if="the user asks for a URL, a shareable link, or a QR code for the review">

```bash
crit-plus share <file>
```

**Always relay the full output to the user** — copy the URL directly into your response.

To remove a shared review: `crit-plus unpublish [file...]`
</important>
"""
